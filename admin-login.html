
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTAGE X | Admin Login</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0b1728;
  font-family: Arial, sans-serif;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 35px;
  border-radius: 16px;
}

.brand {
  text-align: center;
  color: #10223b;
  font-size: 22px;
  font-weight: bold;
}

.gold {
  color: #b58a3b;
}

.subtitle {
  text-align: center;
  color: #788394;
  font-size: 13px;
  margin-bottom: 28px;
}

h2 {
  color: #10223b;
  font-size: 20px;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-size: 13px;
  color: #344054;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #dce1e8;
  border-radius: 8px;
  outline-color: #b58a3b;
}

button {
  width: 100%;
  margin-top: 23px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #10223b;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#adminMessage {
  margin-top: 15px;
  font-size: 13px;
  text-align: center;
  color: #b42318;
}

.footer {
  margin-top: 25px;
  text-align: center;
  font-size: 12px;
  color: #8993a3;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="brand">
    VANTAGE <span class="gold">X</span>
  </div>

  <p class="subtitle">COMMUNITY ADMINISTRATION</p>

  <h2>Administrator Sign In</h2>

  <p style="font-size:13px;color:#788394;">
    Authorised administrators only.
  </p>

  <form id="adminLoginForm">

    <label>Email Address</label>
    <input
      type="email"
      id="adminEmail"
      required
      autocomplete="username"
      placeholder="Administrator email">

    <label>Password</label>
    <input
      type="password"
      id="adminPassword"
      required
      autocomplete="current-password"
      placeholder="Enter your password">

    <button type="submit" id="adminLoginButton">
      Secure Admin Login
    </button>

    <div id="adminMessage" role="status"></div>

  </form>

  <div class="footer">
    VANTAGE X GROUP LTD<br>
    Protected Administration Portal
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin-auth.js"></script>

<script>
document.getElementById("adminLoginForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;

  const message =
    document.getElementById("adminMessage");

  const button =
    document.getElementById("adminLoginButton");

  button.disabled = true;
  button.textContent = "Verifying access...";
  message.textContent = "";

  try {

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    const access = await verifyCommunityAdmin();

    if (!access.authorized) {

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not authorised to access the Admin Centre."
      );
    }

    window.location.replace("admin.html");

  } catch (error) {

    message.textContent =
      error.message || "Administrator login failed.";

    button.disabled = false;
    button.textContent = "Secure Admin Login";
  }

});
</script>

</body>
</html>
